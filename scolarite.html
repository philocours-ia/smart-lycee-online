<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scolarité</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<h1>Paiement de Scolarité</h1>

<div class="card">

<form id="paiementForm">

<input
type="number"
id="eleve_id"
placeholder="ID Élève"
required>

<input
type="number"
id="montant"
placeholder="Montant versé"
required>

<select id="trimestre">

<option value="1">
1er Trimestre
</option>

<option value="2">
2ème Trimestre
</option>

<option value="3">
3ème Trimestre
</option>

</select>

<button type="submit">
Enregistrer Paiement
</button>

</form>

</div>

<div class="card">

<h3>Historique des Paiements</h3>

<table>

<thead>

<tr>
<th>Élève</th>
<th>Montant</th>
<th>Trimestre</th>
<th>Date</th>
</tr>

</thead>

<tbody id="paiementsBody">

</tbody>

</table>

</div>

<script src="assets/js/scolarite.js"></script>

</body>
</html>
