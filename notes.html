<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestion des Notes</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<h1>Gestion des Notes</h1>

<div class="card">

<form id="noteForm">

<input type="number" id="eleve_id" placeholder="ID Élève">

<input type="text" id="matiere" placeholder="Matière">

<input type="number"
step="0.25"
min="0"
max="20"
id="note">

<button type="submit">
Ajouter
</button>

</form>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Élève</th>
<th>Matière</th>
<th>Note</th>
</tr>
</thead>

<tbody id="notesBody">

</tbody>

</table>

</div>

<script src="assets/js/notes.js"></script>

</body>
</html>
